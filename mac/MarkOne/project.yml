name: MarkOne
options:
  bundleIdPrefix: com.superhighfives
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MarkOne:
    type: application
    platform: macOS
    sources:
      - App
      # FFmpeg's license, which has to ship with its libraries
      - path: Vendor/ffmpeg/COPYING.LGPLv2.1
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Mark One
        PRODUCT_BUNDLE_IDENTIFIER: com.superhighfives.markone
        CODE_SIGN_ENTITLEMENTS: App/MarkOne.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's feed and public key, merged with the generated keys below
        INFOPLIST_FILE: App/Info.plist
        # Sparkle's feed. Empty, so builds from source don't update
        # themselves into the release build; scripts/build-release.sh sets it.
        MARK_ONE_FEED_URL: ""
        INFOPLIST_KEY_CFBundleDisplayName: Mark One
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Charlie Gleason"
        # HTTPS only, which is exempt; answers App Store Connect's export question
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Mark One reads your E-M5's video and sends it to the Mark One camera.
        # libavcodec, built by scripts/build-libavcodec.sh
        SWIFT_OBJC_BRIDGING_HEADER: App/MarkOne-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/ffmpeg/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/ffmpeg/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - target: MarkOneCamera
        embed: true
      - package: Sparkle
      - package: KeyboardShortcuts
      - framework: Vendor/ffmpeg/lib/libavcodec.63.dylib
        embed: true
        codeSign: true
      - framework: Vendor/ffmpeg/lib/libavutil.61.dylib
        embed: true
        codeSign: true
  MarkOneCamera:
    type: system-extension
    platform: macOS
    sources: [Extension]
    settings:
      base:
        PRODUCT_NAME: com.superhighfives.markone.camera
        PRODUCT_BUNDLE_IDENTIFIER: com.superhighfives.markone.camera
        CODE_SIGN_ENTITLEMENTS: Extension/MarkOneCamera.entitlements
        INFOPLIST_FILE: Extension/Info.plist
        SKIP_INSTALL: YES
        # The extension's own build number. Change it only when the
        # extension changes: replacing it can lose the camera until the
        # Mac restarts (see "Camera extension updates" in NOTES.md).
        CURRENT_PROJECT_VERSION: "5"
  markone-feed:
    type: tool
    platform: macOS
    sources: [Feed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superhighfives.markone.feed
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Sends the camera's video to the Mark One virtual camera.
