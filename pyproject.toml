readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libusb-package>=1.0.30.0",
    "numpy>=2",
    "pillow>=13.0.0",
    "pyusb>=1.3.1",
]

[tool.uv]
package = false
